name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  codegen:
    name: Generated models are current
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with code generation sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt

      - name: Check generator formatting
        run: cargo fmt --manifest-path tools/codegen/Cargo.toml --all --check

      - name: Lint generator
        run: cargo clippy --manifest-path tools/codegen/Cargo.toml --locked --all-targets -- -D warnings

      - name: Regenerate models
        run: cargo run --manifest-path tools/codegen/Cargo.toml --locked

      - name: Check generated files
        run: git diff --exit-code -- assets src/generated

  rust:
    name: ${{ matrix.os }} / Rust 1.99.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

  msrv:
    name: Ubuntu / Rust 1.88 MSRV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check minimum supported Rust version
        run: cargo +1.88.0 check --locked --all-targets --all-features
