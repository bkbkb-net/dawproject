[package]
name = "dawproject"
version = "0.12.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bkbkb-net/dawproject.git"
documentation = "https://docs.rs/dawproject/"
description = "A port of DAWproject in Rust."
readme = "README.md"
edition = "2021"
rust-version = "1.88"
exclude = ["dawproject", "tools"]

[dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
num = "0.4.3"
zip = { version = "9.1.2", features = ["deflate"], default-features = false }
